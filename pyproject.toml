[project]
name = "scalable-project-2"
version = "0.1.0"
description = "Group 11 Project 2 for Scalable Computing (2026)"
readme = "README.md"
authors = [
    { name = "Seán McGoff", email = "mcgoffs@tcd.ie" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
]

[project.scripts]
sim = "scripts.sim:main"
bundle = "scripts.bundle:main"
exp = "scripts.exp:main"
det = "scripts.determinism:main"
validate = "scripts.validate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scripts"]

[tool.hatch.build]
dev-mode-dirs = ["src", "src/student", "src/grader"]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "ruff>=0.17.6",
]
